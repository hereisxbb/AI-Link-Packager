name: Build Windows Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || github.event.head_commit.message == 'Release v0.1.2'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Windows executables
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Link-Packager-Windows
          path: |
            release/AI Link Packager-Setup-*.exe
            release/AI Link Packager-Portable-*.exe
          if-no-files-found: error

      - name: Publish requested v0.1.2 release
        if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v0.1.2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 `
            "release/AI Link Packager-Setup-0.1.2-x64.exe" `
            "release/AI Link Packager-Portable-0.1.2-x64.exe" `
            --title "AI Link Packager v0.1.2" `
            --notes-file RELEASE_NOTES_v0.1.2.md `
            --target "${{ github.sha }}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AI Link Packager ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v0.1.2.md
          files: |
            release/AI Link Packager-Setup-*.exe
            release/AI Link Packager-Portable-*.exe
